<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#32363b">
    <link rel="icon" type="image/svg+xml" href="./asset/logo/soyon-favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/login-sign.css">
    <title>Log in | Sign up</title>
</head>
<body class="min-h-screen">
<main class="min-h-screen flex flex-col md:flex-row">

    <!-- Left brand panel -->
    <aside class="relative overflow-hidden bg-[#32363b] text-white md:w-[40%] md:shrink-0 md:sticky md:top-0 md:h-screen md:self-start flex flex-col justify-between px-8 py-8 md:px-[52px] md:py-[52px] min-h-[300px]">
        <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <path d="M100 15 L55 55 L100 90" stroke="rgba(255,255,255,.35)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
            <path d="M0 70 L25 90 L0 110" stroke="rgba(255,255,255,.35)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        </svg>

        <a href="./index.html" class="relative flex items-center gap-3 w-fit" aria-label="SOYON home">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="4"/>
                <rect x="12" y="12" width="20" height="20" rx="4" fill="#32363b"/>
            </svg>
            <span class="text-[22px] font-semibold tracking-[.18em]">SOYON</span>
        </a>

        <div class="relative mt-16 md:mt-0">
            <p class="text-[13px] font-medium tracking-[.2em] text-[#7b96f5] uppercase">Your work, in one place</p>
            <h2 class="font-serif text-[44px] md:text-[56px] leading-[1.08] mt-6">Build something that feels like you.</h2>
            <p class="mt-6 text-[16px] leading-relaxed text-white/70 max-w-[360px]">Save your information, shape your story, and publish when you’re ready.</p>
        </div>
        <div class="hidden md:block h-6"></div>
    </aside>

    <!-- Right form panel -->
    <section class="right-panel relative flex-1 px-6 py-10 md:px-[76px] md:py-[40px]" aria-labelledby="account-title">
        <a href="./index.html" aria-label="Close and return home" class="close-btn muted line-border absolute top-6 right-6 md:top-[42px] md:right-[48px] w-[52px] h-[52px] border flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"/></svg>
        </a>

        <div class="max-w-[622px] mt-12 md:mt-0 md:pt-[30px]">
            <!-- Tabs -->
            <div class="line-border flex gap-8 border-b" role="tablist" aria-label="Account">
                <button id="signup-tab" type="button" role="tab" aria-selected="false" aria-controls="signup-form" class="tab pb-[14px] -mb-px text-[15px] border-b-2">Create account</button>
                <button id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form" class="tab pb-[14px] -mb-px text-[15px] border-b-2">Log in</button>
            </div>

            <p class="eyebrow muted mt-[60px] text-[13px] font-medium tracking-[.2em] uppercase"></p>
            <h1 id="account-title" class="mt-4 text-[40px] md:text-[44px] font-light leading-tight tracking-tight">Welcome back</h1>
            <p id="account-intro" class="muted mt-4 text-[17px] font-light">Log in to your account.</p>

            <!-- Log in -->
            <form class="form mt-12" id="login-form" aria-labelledby="login-tab">
                <div>
                    <label for="login-email" class="muted block text-[12px] font-semibold tracking-[.14em] uppercase">Email address</label>
                    <input id="login-email" name="email" type="email" placeholder="you@email.com" autocomplete="email" required class="field mt-3 w-full h-[68px] px-5 text-[16px]">
                </div>

                <div class="mt-7">
                    <label for="login-password" class="muted block text-[12px] font-semibold tracking-[.14em] uppercase">Password</label>
                    <input id="login-password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required class="field mt-3 w-full h-[68px] px-5 text-[16px]">
                </div>

                <button type="submit" class="submit-btn mt-8 w-full h-[70px] px-8 text-[17px] font-semibold transition">Log in</button>
                <p class="notice" aria-live="polite"></p>
            </form>

            <!-- Create account -->
            <form class="form mt-12" id="signup-form" aria-labelledby="signup-tab" hidden>
                <div>
                    <label for="signup-name" class="muted block text-[12px] font-semibold tracking-[.14em] uppercase">Full name</label>
                    <input id="signup-name" name="name" type="text" placeholder="Your full name" autocomplete="name" required class="field mt-3 w-full h-[68px] px-5 text-[16px]">
                </div>

                <div class="mt-7">
                    <label for="signup-email" class="muted block text-[12px] font-semibold tracking-[.14em] uppercase">Email address</label>
                    <input id="signup-email" name="email" type="email" placeholder="you@email.com" autocomplete="email" required class="field mt-3 w-full h-[68px] px-5 text-[16px]">
                </div>

                <div class="mt-7">
                    <label for="signup-password" class="muted block text-[12px] font-semibold tracking-[.14em] uppercase">Password</label>
                    <input id="signup-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required class="field mt-3 w-full h-[68px] px-5 text-[16px]">
                </div>

                <button type="submit" class="submit-btn mt-8 w-full h-[70px] px-8 text-[17px] font-semibold transition">Create free account</button>
                <p class="notice" aria-live="polite"></p>
            </form>
        </div>
    </section>
</main>

<script type="module" src="./src/login-sign.js"></script>
</body>
</html>
