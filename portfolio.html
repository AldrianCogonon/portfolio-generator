
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage your SOYON portfolios.">
  <title>My Portfolios — SOYON</title>

  <link rel="icon" type="image/svg+xml" href="./asset/logo/soyon-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/portfolio.css">
</head>

<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <a class="brand" href="./index.html" aria-label="SOYON homepage">
      <img src="./asset/logo/soyon-svg-logo-1.svg" alt="SOYON" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="brand-fallback" style="display:none">SOYON</span>
    </a>

    <div class="crumb" aria-label="Breadcrumb">
      Workspace <span>/</span> My Portfolios
    </div>

    <label class="search-wrap" aria-label="Search portfolios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.8"/>
        <path d="m16 16 5 5"/>
      </svg>
      <input id="portfolio-search" class="search" type="search" placeholder="Search your portfolios..." autocomplete="off">
    </label>

    <div class="top-actions">
      <button class="icon-btn bell" id="notification-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
        </svg>
      </button>

      <button class="profile-button" id="profile-button" aria-expanded="false" aria-label="Open profile menu">
        <span class="avatar" aria-hidden="true">AR</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <div class="profile-menu" id="profile-menu">
        <button data-action="profile">My profile</button>
        <button data-action="settings">Settings</button>
        <button data-action="logout">Log out</button>
      </div>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand-row">
      <a href="./index.html#top" aria-label="SOYON home" class="sidebar-brand">
        <span class="logo-gradient" aria-hidden="true"></span>
      </a>

      <button id="mobile-close" type="button" class="mobile-close" aria-label="Close navigation">
        <svg viewBox="0 0 24 24" class="close-icon" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>

    <p class="nav-section-label">Workspace</p>

    <nav aria-label="Main navigation" class="side-nav">
      <a href="./index.html" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
        </svg>
        <span>Home</span>
      </a>

      <a href="./dashboard.html" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
          <path d="M3.5 9h17M9 9v11.5"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <a href="./portfolio.html" class="nav-link active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7a3 3 0 0 1 3-3h4l2 2h6a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/>
          <path d="M14 11h4"/>
        </svg>
        <span>Portfolios</span>
      </a>

      <a href="./dashboard.html#templates" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Templates</span>
      </a>
    </nav>

    <div class="nav-divider"></div>

    <p class="nav-section-label">Preferences</p>

    <nav aria-label="Preferences" class="side-nav">
      <a href="./dashboard.html#account" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.3"/>
          <path d="M5 20c.7-3.3 3.2-5 7-5s6.3 1.7 7 5"/>
        </svg>
        <span>Account settings</span>
      </a>
    </nav>
  </aside>

  <div id="mobile-overlay" class="mobile-overlay"></div>

  <main>
    <section class="page-heading">
      <div>
        <h1>My Portfolios</h1>
        <p class="subtitle">Your ideas, beautifully presented.</p>
      </div>

      <button class="primary-btn" id="create-portfolio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Create new portfolio
      </button>
    </section>

    <section class="stats" aria-label="Portfolio overview">
      <article class="stat">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
          </svg>
        </div>
        <div>
          <div class="stat-label">Total portfolios</div>
          <div class="stat-value" id="stat-total">3</div>
        </div>
      </article>

      <article class="stat">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
          </svg>
        </div>
        <div>
          <div class="stat-label">Published</div>
          <div class="stat-value" id="stat-published">2</div>
        </div>
      </article>

      <article class="stat">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>
            <path d="M14 3v5h5M8 12h8M8 16h8"/>
          </svg>
        </div>
        <div>
          <div class="stat-label">Drafts</div>
          <div class="stat-value" id="stat-drafts">1</div>
        </div>
      </article>
    </section>

    <section class="portfolio-grid" id="portfolio-list" aria-label="Your portfolios"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/portfolio.js"></script>
</body>
</html>
