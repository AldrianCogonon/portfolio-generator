<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="icon" type="image/svg+xml" href="./asset/logo/soyon-favicon.svg">
  <link rel="stylesheet" href="./src/login-sign.css">
  <title>Reset password | SOYON</title>
</head>
<body>
  <main class="page">
    <section class="account" aria-labelledby="reset-title">
      <p class="brand">SOYON</p>
      <h1 id="reset-title">Choose a new password</h1>
      <p class="intro">Enter a new password for your account.</p>

      <form id="reset-form" class="form">
        <label for="new-password">
          New password
          <input
            id="new-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <label for="confirm-password">
          Confirm new password
          <input
            id="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <button class="submit" type="submit">Update password</button>
        <p id="reset-notice" class="notice" aria-live="polite"></p>
        <a href="./login-sign.html#login">Back to login</a>
      </form>
    </section>
  </main>

  <script type="module" src="./src/reset-password.js"></script>
</body>
</html>
