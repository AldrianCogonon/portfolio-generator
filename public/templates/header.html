<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header
        id="site-header"
        class="sticky top-0 z-50 border-b border-stone-200 bg-stone-50/95 backdrop-blur-md transition-shadow duration-300"
    >
        <div class="mx-0 flex w-full max-w-none items-center justify-between px-2 py-0 sm:px-4 lg:px-6 xl:px-8">
            <a href="#top" aria-label="SOYON home" class="inline-flex items-center">
                <span class="logo-gradient h-12 w-36 sm:h-16 sm:w-48" aria-hidden="true"></span>
            </a>

            <nav aria-label="Account navigation" class="flex items-center gap-3 sm:gap-5">
            <a
                id="login"
                href="./login-sign.html#login"
                class="rounded-sm px-3 py-2 text-sm font-medium text-slate-700 transition hover:text-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
            >
                Login
            </a>

            <a
                id="sign-in"
                href="./login-sign.html#signup"
                class="sunset-gradient-button rounded-sm bg-blue-600 px-8 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
            >
                Sign In
            </a>
            </nav>
        </div>
    </header>

</html>
